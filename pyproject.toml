[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-hf-builder"
version = "0.1.0"
description = "Build Triton model repositories from local Hugging Face checkpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["packaging>=23"]

[project.optional-dependencies]
e2e = ["huggingface-hub>=0.30,<1"]

[project.scripts]
triton-hf = "triton_hf_builder.cli:main"

[project.urls]
Repository = "https://github.com/ai-lab-tech/triton-hf-builder"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triton_hf_builder = ["templates/*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
