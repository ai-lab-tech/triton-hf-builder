name: Package CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - name: Check source and release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
          python scripts/check_release.py
          python scripts/update_compatibility.py --check
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/check_release.py --tag "$RELEASE_TAG"
          fi
      - name: Build wheel from source distribution
        run: |
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Test installed wheel without inference frameworks
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          triton-hf --help
          python -m unittest discover -s tests -v
          python scripts/test_serving.py --help

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  close-dependabot-prs-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Close only Dependabot PRs 1 through 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for number in 1 2 3 4 5; do
            path="repos/$GITHUB_REPOSITORY/pulls/$number"
            author="$(gh api "$path" --jq '.user.login')"
            if [ "$author" != 'dependabot[bot]' ]; then
              echo "PR #$number is not a Dependabot PR; stopping."
              exit 1
            fi
            state="$(gh api --method PATCH "$path" -f state=closed --jq '.state')"
            test "$state" = closed
            echo "PR #$number: verified closed"
          done
